name: CI

# Runs on every pull request, and on main only when a change resets the dependency or Jest caches.
# Every merge to main is a squash of a pull request whose checks ran on its merge with main, and the
# deploy workflows do not wait for CI on main, so a full rerun there gated nothing and cost about 40%
# of the minutes. The run on main is kept for those few paths because Actions caches saved by a pull
# request are visible to that pull request only. Main's runs are what refresh the pnpm store and the
# Jest cache that every new pull request starts from.
#
# Nothing reruns on main after an ordinary merge. Two pull requests merged without rebasing can break
# main between them, and that shows up only in the next pull request whose affected packages include
# the broken code, so rebase before merging when main has moved.
#
# The Supabase stack and the native fingerprint run in db-integration.yml and mobile-fingerprint.yml,
# which only start when their paths change. This file has no path filter on pull requests, so every
# pull request gets a `static` check.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "apps/mobile/babel.config.js"
      - "apps/mobile/jest.config.js"
      - ".nvmrc"

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job here, in db-integration.yml and in mobile-fingerprint.yml repeats the same four setup
# steps, because a composite action would need another file.
# The pnpm version comes from "packageManager" in the root package.json (pnpm/action-setup reads it
# when no version input is given) and the Node version comes from .nvmrc.
#
# Installs use --ignore-scripts. LEFTHOOK=0 only disables running hooks, `lefthook install` still
# writes them, so the flag is the way to skip the root "prepare" script. Nothing else needs install
# scripts, since pnpm only allows lefthook (onlyBuiltDependencies) to run one.

jobs:
  # Mirrors the local gate. `pnpm check` is the first check so that what passes here is what passes
  # on a laptop. The extra checks come after it and are the ones the monorepo ADR lists.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # On a pull request the checkout is the merge into its base, so its first parent is the base tip
      # and the diff against it is exactly what the pull request changes. On main it is the squash
      # commit, whose first parent is the commit before it. Depth 2 fetches both.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Turbo's --affected runs a task only in the packages the pull request changed and the packages
      # that depend on them, so a web pull request does not run the mobile Jest suites. Turbo only maps
      # files inside a package to that package. A change anywhere else (root config, the lockfile, a
      # workflow, the design boards tools/design-export reads) can reach any package without turbo
      # seeing it, so it runs every check, as does an empty diff. Markdown outside the packages is
      # covered by the formatting step and the repository-wide suites below. --no-renames lists both
      # sides of a move, so a file moved out of the root still counts as a root change.
      # The step runs with `shell: bash` for pipefail, so a failing `turbo ls` fails the step instead
      # of reporting no affected packages.
      - name: Work out which checks the pull request needs
        id: scope
        shell: bash
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          outside=$(grep -vE '^(apps|packages|tools)/|\.md$' <<<"$changed" || true)
          if [ -z "$changed" ] || [ -n "$outside" ]; then
            echo "A file outside the packages changed, so every check runs."
            {
              echo "affected="
              echo "full=true"
              echo "web=true"
              echo "mobile=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "TURBO_SCM_BASE=HEAD^1" >> "$GITHUB_ENV"
          TURBO_SCM_BASE=HEAD^1 pnpm -s turbo ls --affected --output=json > "$RUNNER_TEMP/affected.json"
          packages=$(jq -r '.packages.items[].name' "$RUNNER_TEMP/affected.json")
          echo "Affected packages:" $packages
          has() { grep -qx "$1" <<<"$packages"; }
          web=false
          mobile=false
          if has @keylow/web; then web=true; fi
          # The doctor gate is not a dependency of the app, but a change to it is tested by running it.
          if has @keylow/mobile || has @keylow/expo-doctor-gate; then mobile=true; fi
          {
            echo "affected=--affected"
            echo "full=false"
            echo "web=$web"
            echo "mobile=$mobile"
          } >> "$GITHUB_OUTPUT"
      # On a cold start the mobile food search suite alone has Jest transform about 300 React Native
      # and Expo files with Babel, and it took 46 seconds on a runner. Its cache is keyed by file content and
      # transformer config, so restoring one from a near miss is safe: stale entries are never read.
      # The path is the cacheDirectory in apps/mobile/jest.config.js.
      - name: Restore the mobile Jest cache
        if: steps.scope.outputs.mobile == 'true'
        uses: actions/cache@v6
        with:
          path: apps/mobile/node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/babel.config.js', 'apps/mobile/jest.config.js') }}
          restore-keys: jest-${{ runner.os }}-
      - name: Run the local gate
        run: pnpm check ${{ steps.scope.outputs.affected }}
      # The root format:check task belongs to no package, so --affected skips it. Prettier checks the
      # whole repository in seconds, so it runs here instead.
      - name: Check the formatting of the whole repository
        if: steps.scope.outputs.full != 'true'
        run: pnpm format:check
      # Two suites read files across the repository instead of importing them, so turbo never counts
      # them as affected. The source guard in @keylow/config walks every source file in apps/ and
      # packages/ and reads the core helpers. tools/design-export checks docs/design, its READMEs
      # included, and the packages/tokens stylesheet. Both take seconds, so they always run.
      - name: Run the repository-wide suites
        if: steps.scope.outputs.full != 'true'
        run: pnpm turbo run test --filter=@keylow/config --filter=@keylow/design-export
      # Builds the web Storybook, so a broken story or a Storybook config that no longer matches Next
      # fails the pull request.
      - name: Build the web Storybook
        if: steps.scope.outputs.web == 'true'
        run: pnpm turbo run build-storybook --filter=@keylow/web
      # Builds the web app the way Vercel does. `pnpm check` type-checks with tsc alone, and `next build`
      # runs its own type-check and compile pass, which has failed on a pull request that passed the
      # gate. Vercel's own build is not relied on for this, since it builds the branch head rather than
      # the merge with main and its turbo-ignore can skip a multi-commit push. Every route is rendered
      # on demand, so the build needs no Supabase environment variables.
      - name: Build the web app
        if: steps.scope.outputs.web == 'true'
        run: pnpm turbo run build --filter=@keylow/web
      # Fails when the lockfile contains duplicates that a dedupe would remove. A lockfile change
      # always makes a full run, so the other runs skip it.
      # The flag keeps the install pass that dedupe runs from triggering the prepare script.
      - name: Check the lockfile for duplicates
        if: steps.scope.outputs.full == 'true'
        run: pnpm dedupe --check --ignore-scripts
      # Mobile Storybook has no static build. Its stories are type-checked and rendered in both schemes by
      # the gate above (tsc covers .rnstorybook, and the Jest smoke test renders every story). What is left
      # is that the committed story index is the one the story files generate, which Metro rewrites on start.
      - name: Check the mobile story index is committed
        if: steps.scope.outputs.mobile == 'true'
        run: |
          pnpm --filter @keylow/mobile exec sb-rn-get-stories --config-path .rnstorybook
          git diff --exit-code apps/mobile/.rnstorybook/storybook.requires.ts
      # Some doctor checks call the Expo API. A run where every failure is a network error is
      # downgraded to a warning, so an Expo outage does not block merges.
      # Expo patch releases are installed in a batch, when a native build is being made anyway, because
      # each one changes the native fingerprint. doctor has no option for "patch mismatches only", so
      # tools/expo-doctor-gate runs it and reads its report. A package that is only a patch behind gets a
      # warning annotation. Every other failure, a minor or major mismatch included, fails the step, and so
      # does a report the script cannot read.
      - name: Check the Expo project health
        if: steps.scope.outputs.mobile == 'true'
        working-directory: apps/mobile
        env:
          EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: "true"
        run: node --experimental-strip-types ../../tools/expo-doctor-gate/src/runDoctorGate.ts
