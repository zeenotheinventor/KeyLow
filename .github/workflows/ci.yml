name: CI

# Runs on every pull request and on every push to main. A pull request runs only the checks its
# change can affect. A push to main always runs every check, as a full run.
#
# Two sessions merge pull requests in parallel, and two pull requests that each pass on their own can
# break main together. A pull request run sees main only as it was when the run started, so the full
# run on each push to main is the guard. The deploy workflows do not wait for it, so it never slows a
# merge. Actions minutes are free now that the repository is public, which is why this is no longer
# limited to the pushes that reset a cache. Every commit on main gets its own run, and those runs
# go in parallel and are never cancelled (see the concurrency block).
#
# Pull requests only restore the pnpm store and the Jest cache and never save them. A cache saved by
# a pull request is visible to that pull request only, and each lockfile change saved its own 1.2 to
# 1.5 GB pnpm store, which pushed the repository past the 10 GB Actions cache limit. Actions then
# evicts the least recently used caches first, which included main's own store and Jest cache. A pull
# request that changes the lockfile restores the closest earlier store from main and downloads only
# what is missing, which is what its first run did anyway. Main's runs save both caches, and only when
# the exact key was not restored, so a push that changes neither the lockfile nor the Jest or Babel
# config restores both caches and saves nothing.
#
# One job, `checks`, runs everything but the native fingerprint (mobile-fingerprint.yml, which only
# starts when its paths change). This file has no path filter on pull requests, so every pull request
# gets a `checks` run.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request makes the older run pointless, so a pull request has one group per
# ref and a newer push cancels the older run. A push to main has a group of its own per commit, which
# nothing else ever joins, so no run on main is cancelled or dropped and every merge commit gets a
# complete run. Two runs on main can both miss the same cache key and both try to save it. The second
# save only logs a warning that the key already exists.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# The job here and the one in mobile-fingerprint.yml repeat the same setup steps, because a
# composite action would need another file.
# The pnpm version comes from "packageManager" in the root package.json (pnpm/action-setup reads it
# when no version input is given) and the Node version comes from .nvmrc.
#
# Installs use --ignore-scripts. LEFTHOOK=0 only disables running hooks, `lefthook install` still
# writes them, so the flag is the way to skip the root "prepare" script. Nothing else needs install
# scripts, since pnpm only allows lefthook (onlyBuiltDependencies) to run one.

jobs:
  # Mirrors the local gate, minus the web tests and web builds. KeyLow is mobile first, so this job
  # runs `pnpm check:ci`, which is `pnpm check` with the @keylow/web test task left out. The web
  # app is still formatted, linted and type-checked here, so a change to a shared package that
  # breaks web still fails the pull request. What it skips is the web Vitest suite, the web
  # Storybook build and the web app build. Vercel builds the web app (not Storybook) as its own
  # check, but only when a pull request affects web (apps/web/vercel.json runs turbo-ignore), and it
  # builds the branch head rather than the merge with main. `pnpm check` is unchanged and still
  # runs the web tests, so run it locally for a web change. The extra checks come after the gate
  # and are the ones the monorepo ADR lists.
  #
  # When a pull request changes something the Supabase stack, the Edge Functions or the integration
  # suites read, and on every push to main, the same job also runs those against a real local stack.
  # The stack starts in the background right after the install, so its image pulls and boot overlap
  # the static checks. A separate job cost a second checkout, install and minute rounding, and booted
  # the stack on its own clock. The stack steps run even when a static check fails, so one run
  # reports both.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On a pull request the checkout is the merge into its base, so its first parent is the base tip
      # and the diff against it is exactly what the pull request changes. A push to main does not read
      # the diff, because it is always a full run. Depth 2 fetches the first parent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      # No `cache: pnpm` here, because setup-node saves the store at the end of every job that missed,
      # pull requests included. The steps below restore and save the store themselves, under the key
      # setup-node uses (node-cache-<os>-<arch>-pnpm-<hash of the lockfile>). The key matches the
      # store main already holds, and eas-update.yml and deploy-supabase.yml (push to main only)
      # still use setup-node's cache under the same key. The architecture is x64 on ubuntu-latest.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Every run restores. The exact key is the store for this lockfile. The prefix falls back to the
      # newest earlier store, and `pnpm install` fetches whatever the lockfile has beyond it.
      - name: Restore the pnpm store
        id: pnpm-store-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-cache-${{ runner.os }}-x64-pnpm-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Only main saves, and only when the exact key was not restored. Saving here, right after the
      # install, keeps the store complete and out of reach of a later failing check.
      - name: Save the pnpm store
        if: github.event_name == 'push' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      # Turbo's --affected runs a task only in the packages the pull request changed and the packages
      # that depend on them, so a web pull request does not run the mobile Jest suites. Turbo only maps
      # files inside a package to that package. A change anywhere else (root config, the lockfile, a
      # workflow, the design boards tools/design-export reads) can reach any package without turbo
      # seeing it, so it runs every check, as does an empty diff. A push to main runs every check
      # without looking at the diff. Markdown outside the packages is covered by the formatting step
      # and the repository-wide suites below. --no-renames lists both sides of a move, so a file moved
      # out of the root still counts as a root change.
      # The step runs with `shell: bash` for pipefail, so a failing `turbo ls` fails the step instead
      # of reporting no affected packages.
      - name: Work out which checks the pull request needs
        id: scope
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "A push to main runs every check, the Supabase stack included."
            {
              echo "db=true"
              echo "affected="
              echo "full=true"
              echo "mobile=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          # The stack runs for the packages the stack, the functions (which embed @keylow/core) and the
          # integration suites read, and for root files that change the tools or the task graph.
          db=false
          if grep -qE '^(packages/(db|core|api-client|config)/|(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|turbo\.json|tsconfig\.base\.json|\.nvmrc|\.github/workflows/ci\.yml)$)' <<<"$changed"; then
            db=true
          fi
          echo "Supabase stack needed: $db"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          outside=$(grep -vE '^(apps|packages|tools)/|\.md$' <<<"$changed" || true)
          if [ -z "$changed" ] || [ -n "$outside" ]; then
            echo "A file outside the packages changed, so every check runs."
            {
              echo "affected="
              echo "full=true"
              echo "mobile=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "TURBO_SCM_BASE=HEAD^1" >> "$GITHUB_ENV"
          TURBO_SCM_BASE=HEAD^1 pnpm -s turbo ls --affected --output=json > "$RUNNER_TEMP/affected.json"
          packages=$(jq -r '.packages.items[].name' "$RUNNER_TEMP/affected.json")
          echo "Affected packages:" $packages
          has() { grep -qx "$1" <<<"$packages"; }
          mobile=false
          # The doctor gate is not a dependency of the app, but a change to it is tested by running it.
          if has @keylow/mobile || has @keylow/expo-doctor-gate; then mobile=true; fi
          {
            echo "affected=--affected"
            echo "full=false"
            echo "mobile=$mobile"
          } >> "$GITHUB_OUTPUT"
      # Pinned to the CLI version used locally. The action also accepts "latest".
      - uses: supabase/setup-cli@v3
        if: steps.scope.outputs.db == 'true'
        with:
          version: 2.106.0
      # The CLI pulls some of its images from public.ecr.aws, which refuses anonymous pulls with
      # "toomanyrequests: Rate exceeded" once a runner's address has used its quota. The same images
      # are on GitHub's registry, which does not share that quota. Pulling them from there and tagging
      # them with the names the CLI looks for means it finds them locally and never calls ECR.
      # postgres-meta v0.96.6 is what `supabase start` runs for the meta service and v0.96.1 is
      # what `supabase gen types` runs (the failed log named it), so both are pulled.
      # edge-runtime is what `supabase functions serve` runs and pg_prove is what `supabase test
      # db` runs. Bump a tag here when the CLI pin above moves.
      #
      # `supabase start` keeps the services the tests and type generation need. That is the database,
      # the API gateway (kong), rest and meta (gen types). Auth always starts and cannot be excluded.
      # Excluded: analytics and vector (log pipeline), edge-runtime and functions, imgproxy,
      # inbucket (mail catcher), realtime, storage and studio.
      #
      # All of it runs in the background and writes its exit status to a file, which the wait step
      # below reads after the static checks. The file is written under another name and moved, so the
      # wait step never reads it half written.
      - name: Start the local Supabase stack in the background
        id: start
        if: steps.scope.outputs.db == 'true'
        working-directory: packages/db
        run: |
          nohup bash -c '
            (
              set -e
              for image in postgres-meta:v0.96.1 postgres-meta:v0.96.6 edge-runtime:v1.74.1 pg_prove:3.36; do
                docker pull "ghcr.io/supabase/$image"
                docker tag "ghcr.io/supabase/$image" "public.ecr.aws/supabase/$image"
              done
              supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,realtime,storage,studio,vector
            )
            echo $? > "$RUNNER_TEMP/supabase-start.status.tmp"
            mv "$RUNNER_TEMP/supabase-start.status.tmp" "$RUNNER_TEMP/supabase-start.status"
          ' > "$RUNNER_TEMP/supabase-start.log" 2>&1 &
      # On a cold start the mobile food search suite alone has Jest transform about 300 React Native
      # and Expo files with Babel, and it took 46 seconds on a runner. Its cache is keyed by file content and
      # transformer config, so restoring one from a near miss is safe: stale entries are never read.
      # The path is the cacheDirectory in apps/mobile/jest.config.js. Pull requests only restore it,
      # and the step that saves it runs on main (see the header).
      - name: Restore the mobile Jest cache
        id: jest-cache
        if: steps.scope.outputs.mobile == 'true'
        uses: actions/cache/restore@v6
        with:
          path: apps/mobile/node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/babel.config.js', 'apps/mobile/jest.config.js') }}
          restore-keys: jest-${{ runner.os }}-
      # `check:ci` is `pnpm check` for every package except @keylow/web, plus the web format, lint and
      # type-check tasks, so it skips only the web tests (see the root package.json). The flag reaches
      # both turbo runs inside the script.
      - name: Run the local gate
        run: pnpm check:ci ${{ steps.scope.outputs.affected }}
      # Saved after the gate, which is what fills the Jest cache. Only main saves, and only on a miss
      # of the exact key.
      - name: Save the mobile Jest cache
        if: github.event_name == 'push' && steps.scope.outputs.mobile == 'true' && steps.jest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/mobile/node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/babel.config.js', 'apps/mobile/jest.config.js') }}
      # The root format:check task belongs to no package, so --affected skips it. Prettier checks the
      # whole repository in seconds, so it runs here instead.
      - name: Check the formatting of the whole repository
        if: steps.scope.outputs.full != 'true'
        run: pnpm format:check
      # Two suites read files across the repository instead of importing them, so turbo never counts
      # them as affected. The source guard in @keylow/config walks every source file in apps/ and
      # packages/ and reads the core helpers. tools/design-export checks docs/design, its READMEs
      # included, and the packages/tokens stylesheet. Both take seconds, so they always run.
      - name: Run the repository-wide suites
        if: steps.scope.outputs.full != 'true'
        run: pnpm turbo run test --filter=@keylow/config --filter=@keylow/design-export
      # Fails when the lockfile contains duplicates that a dedupe would remove. A lockfile change
      # always makes a full run, and so does every push to main, so the other runs skip it.
      # The flag keeps the install pass that dedupe runs from triggering the prepare script.
      - name: Check the lockfile for duplicates
        if: steps.scope.outputs.full == 'true'
        run: pnpm dedupe --check --ignore-scripts
      # Mobile Storybook has no static build. Its stories are type-checked and rendered in both schemes by
      # the gate above (tsc covers .rnstorybook, and the Jest smoke test renders every story). What is left
      # is that the committed story index is the one the story files generate, which Metro rewrites on start.
      - name: Check the mobile story index is committed
        if: steps.scope.outputs.mobile == 'true'
        run: |
          pnpm --filter @keylow/mobile exec sb-rn-get-stories --config-path .rnstorybook
          git diff --exit-code apps/mobile/.rnstorybook/storybook.requires.ts
      # Some doctor checks call the Expo API. A run where every failure is a network error is
      # downgraded to a warning, so an Expo outage does not block merges.
      # Expo patch releases are installed in a batch, when a native build is being made anyway, because
      # each one changes the native fingerprint. doctor has no option for "patch mismatches only", so
      # tools/expo-doctor-gate runs it and reads its report. A package that is only a patch behind gets a
      # warning annotation. Every other failure, a minor or major mismatch included, fails the step, and so
      # does a report the script cannot read.
      - name: Check the Expo project health
        if: steps.scope.outputs.mobile == 'true'
        working-directory: apps/mobile
        env:
          EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: "true"
        run: node --experimental-strip-types ../../tools/expo-doctor-gate/src/runDoctorGate.ts
      # Bounded at ten minutes. Prints the start log either way, so a failed pull or start is explained.
      - name: Wait for the Supabase stack
        id: stack
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          for attempt in $(seq 1 300); do
            if [ -f "$RUNNER_TEMP/supabase-start.status" ]; then
              break
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/supabase-start.log"
          status=$(cat "$RUNNER_TEMP/supabase-start.status" 2>/dev/null || echo "no status after ten minutes")
          if [ "$status" != "0" ]; then
            echo "The Supabase stack did not start: $status."
            exit 1
          fi
      # `functions serve` starts its own edge-runtime container, so edge-runtime stays in the -x list
      # above. The functions import the @keylow/core bundle, so it is written first. The container
      # reaches the OFF mock the tests start on the runner through the gateway address of the
      # stack's Docker network. Docker Desktop resolves host.docker.internal, a Linux runner does
      # not, so the env file the function reads gets the gateway address in its place. The loop is
      # bounded. A function that never answers fails the step, and the last step of the job prints the
      # serve log.
      - name: Serve the Edge Functions
        id: serve
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        working-directory: packages/db
        run: |
          pnpm --filter @keylow/db bundle-core-for-deno
          gateway=$(docker network inspect supabase_network_keylow --format '{{(index .IPAM.Config 0).Gateway}}')
          sed "s/host.docker.internal/$gateway/" supabase/functions/.env.test > "$RUNNER_TEMP/functions.env"
          nohup supabase functions serve --env-file "$RUNNER_TEMP/functions.env" --no-verify-jwt \
            > "$RUNNER_TEMP/functions-serve.log" 2>&1 &
          for attempt in $(seq 1 45); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/off-product || true)
            if [ "$status" = "204" ] || [ "$status" = "401" ]; then
              echo "The functions are being served."
              exit 0
            fi
            sleep 2
          done
          echo "The functions were not served within 90 seconds. The last status was $status."
          exit 1
      # check:integration includes check:functions. Turbo bundles @keylow/core for Deno first, then
      # `deno check` and `deno lint` run from the pinned `deno` npm package, so no Deno setup step is
      # needed. Deno downloads the supabase-js and zod packages itself. After the pgTAP tests, the
      # Edge Function HTTP suites run against the served functions.
      - name: Check the Edge Functions and run the pgTAP tests and the function suites
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: pnpm check:integration
      # gen-types rewrites the file in place, so any difference means it was not committed.
      - name: Check the generated types are committed
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          pnpm gen-types
          git diff --exit-code packages/db/src/types.gen.ts
      # Shows what the functions logged, which is where a 5xx from a suite is explained.
      - name: Print the functions serve log
        if: ${{ failure() && steps.serve.outcome != 'skipped' }}
        run: cat "$RUNNER_TEMP/functions-serve.log" || true
