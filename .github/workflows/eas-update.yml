# Publish an over-the-air (OTA) update to the production EAS channel.
#
# What it does: on a push to main that touches code bundled into the mobile
# app, and on manual dispatch, it installs dependencies and runs
# `eas update` for the `production` channel.
#
# Release policy: continuous deployment with no approval gate. Every qualifying push to main
# publishes straight away, and the installed production build picks the update up on its next
# launch. Releases are meant to be gated later with feature flags, not with a manual approval
# step, so the `production` environment deliberately has no required reviewers.
#
# One-time setup in GitHub (Settings of this repository, done by Zee):
#
#   1. Settings > Environments > New environment, named exactly `production`
#      (shared with deploy-supabase.yml). Leave "Required reviewers" off. The
#      job below declares `environment: production` only to read the
#      environment's secret and to apply its branch policy, so a run starts as
#      soon as it is triggered.
#   2. On that environment, add this secret under "Environment secrets"
#      (not a repository secret, so that only runs on an allowed branch can
#      read it):
#        EXPO_TOKEN  Expo access token for the EAS account (KEY-13)
#   3. On that same environment, set "Deployment branches" to "Selected
#      branches" and allow only `main` (Settings > Environments > production
#      > Deployment branches). This branch policy is the only restriction on
#      the environment: it stops a manual run from a feature branch from
#      reading the secret and publishing that branch.
#
# Prerequisites in the app itself (KEY-26), now in place: expo-updates is
# installed, and app.json carries `extra.eas.projectId` and `updates.url`.
#
# Build-time values: Metro inlines EXPO_PUBLIC_* values into the bundle when
# `eas update` exports it, and the runner has no .env.local. The publish step
# therefore sets the four EXPO_PUBLIC_* values as plain `env:` (Supabase URL and
# publishable key, Google iOS and web client ids). They are public values that
# ship in every app binary, so they are not secrets. Keep them in step with the
# `base` profile in apps/mobile/eas.json, which feeds the same values to EAS
# builds, so the embedded bundle and an OTA bundle never disagree.
#
# Scope: OTA carries JavaScript only. A native change (new native dependency,
# config plugin or SDK bump) changes the fingerprint runtime version and needs
# a new store build. An update published under a runtime version that no
# installed build has is simply never delivered.
#
# Who receives it: the main Ki-Lo app, built with the `production-apk` profile in
# apps/mobile/eas.json (package com.sojisoft.keylow, channel `production`). This job
# runs without APP_VARIANT, as does that build, so both compute the same fingerprint
# runtime version. The development build sets APP_VARIANT=development, gets a different
# package and fingerprint, and never receives these updates.
#
# Not verifiable before the secret exists and a real push to main happens.

name: EAS Update

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "packages/api-client/**"
      - "packages/tokens/**"
      - "packages/db/src/**"
  workflow_dispatch:

permissions:
  contents: read

# Two merges must not publish OTA updates in parallel.
concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    name: Publish OTA update to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7

      # No version input: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # LEFTHOOK=0 stops the root `prepare` script from installing git hooks in CI.
      - name: Install dependencies
        env:
          LEFTHOOK: "0"
        run: pnpm install --frozen-lockfile

      # The action silently skips authentication when the token is empty, which
      # would surface later as an obscure eas error. Fail here with the reason.
      # Checked in the shell because a step's own env is not visible to its `if`.
      - name: Check the EXPO_TOKEN secret is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN is not set::Add EXPO_TOKEN as a secret on the production environment (see the header of this workflow)."
            exit 1
          fi

      # The packager only installs the EAS CLI. npm ships with Node, so the job
      # does not depend on yarn (the action default) being present.
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      # `--channel` publishes to the branch linked to the production channel,
      # which is what production builds listen to, and EAS creates and links
      # that branch if it is missing. `--branch` and `--channel` cannot be
      # combined. `--auto` takes the update message from the commit message.
      # `--environment production` selects the EAS-side environment (expo.dev,
      # not the GitHub one) whose variables the export may read. `eas update`
      # requires the flag for Expo SDK 55 and later.
      - name: Publish the update
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://kixqmrugtcwqdmvzazik.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_VLA-EzM1x57JvajL11pqkg_jn7hPgMB
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 127670518185-ni3pj7ngsfunqnqr5mmsd7bvmjp7ooi8.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 127670518185-hp20gpd441vf5j74b1bt5u23vvsock8e.apps.googleusercontent.com
        run: eas update --channel production --environment production --auto --non-interactive
