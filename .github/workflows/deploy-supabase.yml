# Deploy to the production Supabase project (keylow-prod, eu-west-2).
#
# What it does: on a push to main that touches packages/db/supabase or
# packages/core/src, and on manual dispatch, it bundles @keylow/core for Deno,
# links the CLI to production, applies pending migrations with
# `supabase db push`, then deploys Edge Functions with
# `supabase functions deploy` when any exist. A change in core redeploys the
# functions because each one embeds its own copy of the core bundle.
#
# Release policy: continuous deployment with no approval gate. Every qualifying push to main
# deploys straight away. Releases are meant to be gated later with feature flags, not with a
# manual approval step, so the `production` environment deliberately has no required reviewers.
#
# One-time setup in GitHub (Settings of this repository, done by Zee):
#
#   1. Settings > Environments > New environment, named exactly `production`.
#      Leave "Required reviewers" off. The job below declares `environment:
#      production` only to read the environment's secrets and to apply its
#      branch policy, so a run starts as soon as it is triggered.
#   2. On that environment, add these three secrets under "Environment
#      secrets" (not repository secrets, so that only runs on an allowed
#      branch can read them):
#        SUPABASE_ACCESS_TOKEN  personal access token (KEY-11)
#        SUPABASE_PROJECT_ID    project ref of keylow-prod (KEY-11)
#        SUPABASE_DB_PASSWORD   database password of keylow-prod (KEY-11)
#   3. On that same environment, set "Deployment branches" to "Selected
#      branches" and allow only `main` (Settings > Environments > production
#      > Deployment branches). This branch policy is the only restriction on
#      the environment: it stops a manual run from a feature branch from
#      reading the secrets and deploying that branch.
#
# Not verifiable before the secrets exist and a real push to main happens.
# The Supabase CLI is pinned below. Bump it deliberately.

name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "packages/db/supabase/**"
      - "packages/core/src/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one mid-flight
# (a half-applied migration run is worse than a queued one).
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: Push migrations and functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # The Supabase project lives in packages/db/supabase, so the CLI runs from packages/db.
    defaults:
      run:
        working-directory: packages/db
    steps:
      - uses: actions/checkout@v7

      # The bundle is built before anything touches production, so a broken bundle stops the run
      # early. The pnpm version comes from "packageManager" in the root package.json and the Node
      # version from .nvmrc, as in ci.yml. The install skips scripts for the same reason as there.
      # The two pnpm steps run at the repo root, because the job default is packages/db.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Writes packages/db/supabase/functions/_shared/core/, which is gitignored, so a checkout
      # never has it. The functions import it, so it must exist before `supabase functions deploy`.
      - name: Bundle @keylow/core for the Edge Functions
        working-directory: .
        run: pnpm --filter @keylow/db bundle-core-for-deno

      - uses: supabase/setup-cli@v3
        with:
          version: 2.106.0

      - name: Link the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes

      # Directories starting with an underscore (for example _shared) hold shared
      # code, not functions.
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -not -name '_*' 2>/dev/null)" ]; then
            supabase functions deploy --use-api
          else
            echo "No Edge Functions found under packages/db/supabase/functions, skipping."
          fi
