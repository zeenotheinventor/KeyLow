<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Password reset</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c865e6773d939c69a7c6186f18bec567">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font-sans); font-size: var(--type-body-size); line-height: var(--type-body-line); background: var(--background); color: var(--text-primary)">

<sc-if value="{{hasBack}}" hint-placeholder-val="{{ true }}">
<div style="flex-shrink: 0; display: flex; align-items: center; padding: 56px var(--space-4) 0 var(--space-2)">
<button data-kilo="IconButton ghost" type="button" aria-label="Back to sign in" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: var(--radius-small); color: var(--text-primary)"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
</div>
</sc-if>

<sc-if value="{{isCentred}}" hint-placeholder-val="{{ false }}">
<div role="{{centredRole}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); padding: 0 var(--space-8) 34px; text-align: center">
<span style="width: 56px; height: 56px; margin-bottom: var(--space-2); display: flex; align-items: center; justify-content: center; border-radius: var(--radius-medium); background: {{centred.iconBg}}; color: {{centred.iconFg}}">
<sc-if value="{{centred.isMail}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></sc-if>
<sc-if value="{{centred.isWarning}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></sc-if>
<sc-if value="{{centred.isCheck}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg></sc-if>
</span>
<h1 style="margin: 0; font-size: var(--type-h2-size); line-height: var(--type-h2-line); font-weight: var(--type-h2-weight); letter-spacing: var(--type-h2-tracking)">{{centred.title}}</h1>
<p style="margin: 0; font-size: var(--type-body-size); line-height: var(--type-body-line); color: var(--text-secondary)">{{centred.body}}</p>
<div style="align-self: stretch; display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-4)">
<sc-if value="{{centred.hasPrimary}}" hint-placeholder-val="{{ false }}">
<button data-kilo="Button primary" type="button" style="height: var(--control-height-lg); display: flex; align-items: center; justify-content: center; background: var(--accent); border: 0; border-radius: var(--radius-medium); color: var(--accent-foreground); font-family: var(--font-sans); font-size: var(--type-body-strong-size); line-height: var(--type-body-strong-line); font-weight: var(--type-body-strong-weight); letter-spacing: var(--type-body-strong-tracking)">{{centred.primary}}</button>
</sc-if>
<sc-if value="{{centred.hasSecondary}}" hint-placeholder-val="{{ true }}">
<button data-kilo="Button secondary" type="button" style="height: var(--control-height-lg); display: flex; align-items: center; justify-content: center; background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-medium); color: var(--text-primary); font-family: var(--font-sans); font-size: var(--type-body-strong-size); line-height: var(--type-body-strong-line); font-weight: var(--type-body-strong-weight); letter-spacing: var(--type-body-strong-tracking)">{{centred.secondary}}</button>
</sc-if>
<sc-if value="{{centred.hasResend}}" hint-placeholder-val="{{ false }}">
<p style="margin: var(--space-2) 0 0; font-size: var(--type-caption-size); line-height: var(--type-caption-line); font-weight: var(--type-caption-weight); letter-spacing: var(--type-caption-tracking); color: var(--text-secondary)">No email? Check your spam folder, or send it again.</p>
<button data-kilo="Button ghost" type="button" disabled="true" aria-disabled="true" style="height: var(--control-height-md); display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: var(--radius-medium); color: var(--text-muted); font-family: var(--font-sans); font-size: var(--type-body-strong-size); line-height: var(--type-body-strong-line); font-weight: var(--type-body-strong-weight); letter-spacing: var(--type-body-strong-tracking)">Send again in 45 s</button>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
<form style="flex: 1; display: flex; flex-direction: column; justify-content: {{formJustify}}; gap: var(--space-4); margin: 0; padding: {{formPadding}}">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); margin-bottom: var(--space-2)">
<sc-if value="{{hasMark}}" hint-placeholder-val="{{ false }}"><img src="{{markUrl}}" alt="Ki-Lo" style="width: 64px; height: 64px; margin-bottom: var(--space-2)"></sc-if>
<h1 style="margin: 0; font-size: var(--type-h1-size); line-height: var(--type-h1-line); font-weight: var(--type-h1-weight); letter-spacing: var(--type-h1-tracking)">{{heading}}</h1>
<sc-if value="{{hasCaption}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: var(--type-body-size); line-height: var(--type-body-line); color: var(--text-secondary)">{{caption}}</p></sc-if>
</div>

<sc-for list="{{fields}}" as="x" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: var(--space-1)">
<label for="{{x.id}}" style="font-size: var(--type-caption-size); line-height: var(--type-caption-line); font-weight: var(--type-caption-weight); letter-spacing: var(--type-caption-tracking); color: var(--text-secondary)">{{x.label}}</label>
<div data-kilo="Input" style="height: var(--control-height-md); box-sizing: border-box; display: flex; align-items: center; padding: 0 var(--space-4); background: var(--surface-raised); border: 1px solid {{x.border}}; border-radius: var(--radius-medium)">
<input id="{{x.id}}" type="{{x.type}}" autocomplete="{{x.autocomplete}}" value="{{x.value}}" aria-invalid="{{x.invalid}}" onChange="{{noop}}" style="flex: 1; min-width: 0; height: 40px; padding: 0; border: 0; outline: none; background: transparent; font-family: var(--font-sans); font-size: var(--type-body-size); line-height: var(--type-body-line); color: var(--text-primary)">
</div>
<sc-if value="{{x.hasError}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: var(--type-caption-size); line-height: var(--type-caption-line); font-weight: var(--type-caption-weight); letter-spacing: var(--type-caption-tracking); color: var(--danger)">{{x.error}}</span></sc-if>
<sc-if value="{{x.hasHelper}}" hint-placeholder-val="{{ false }}"><span style="font-size: var(--type-caption-size); line-height: var(--type-caption-line); font-weight: var(--type-caption-weight); letter-spacing: var(--type-caption-tracking); color: var(--text-muted)">{{x.helper}}</span></sc-if>
<sc-if value="{{x.hasForgot}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: flex-end">
<a href="#forgot" data-kilo="Link (new on this screen)" style="min-height: var(--touch-target); display: inline-flex; align-items: center; padding: 0 var(--space-1); font-size: var(--type-body-size); line-height: var(--type-body-line); font-weight: 600; color: var(--text-primary); text-decoration: underline">Forgot password?</a>
</div>
</sc-if>
</div>
</sc-for>

<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
<div data-kilo="Banner error" role="alert" style="display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--danger-muted); border: 1px solid var(--danger); border-radius: var(--radius-medium)">
<span style="display: flex; padding-top: 2px; color: var(--danger)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg></span>
<span style="flex: 1; font-size: var(--type-body-size); line-height: var(--type-body-line)">{{errorSentence}}</span>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-2)">
<button data-kilo="Button primary" type="submit" aria-busy="{{busy}}" style="position: relative; height: var(--control-height-lg); display: flex; align-items: center; justify-content: center; background: var(--accent); border: 0; border-radius: var(--radius-medium); color: var(--accent-foreground); font-family: var(--font-sans); font-size: var(--type-body-strong-size); line-height: var(--type-body-strong-line); font-weight: var(--type-body-strong-weight); letter-spacing: var(--type-body-strong-tracking)">
<span style="visibility: {{labelVisibility}}">{{primary}}</span>
<sc-if value="{{busy}}" hint-placeholder-val="{{ false }}"><span aria-label="{{busyLabel}}" style="position: absolute; width: 18px; height: 18px; box-sizing: border-box; border-radius: var(--radius-pill); border: 2px solid currentColor; border-right-color: transparent"></span></sc-if>
</button>
<sc-if value="{{hasGoogle}}" hint-placeholder-val="{{ false }}">
<button data-kilo="Button secondary" type="button" style="height: var(--control-height-lg); display: flex; align-items: center; justify-content: center; gap: var(--space-3); background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-medium); color: var(--text-primary); font-family: var(--font-sans); font-size: var(--type-body-strong-size); line-height: var(--type-body-strong-line); font-weight: var(--type-body-strong-weight); letter-spacing: var(--type-body-strong-tracking)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 48 48" data-kilo="GoogleMark (brand asset)"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>Continue with Google</button>
</sc-if>
</div>

<sc-if value="{{hasFooter}}" hint-placeholder-val="{{ true }}">
<p style="margin: var(--space-2) 0 0; display: flex; align-items: center; justify-content: center; gap: var(--space-1); font-size: var(--type-body-size); line-height: var(--type-body-line); color: var(--text-secondary)">{{footer}}<a href="#switch" style="min-height: var(--touch-target); display: inline-flex; align-items: center; padding: 0 var(--space-1); font-weight: 600; color: var(--text-primary); text-decoration: underline">{{footerLink}}</a></p>
</sc-if>
</form>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screenState":{"editor":"enum","options":["sign-in-forgot","forgot","forgot-field-error","forgot-sending","forgot-error","forgot-sent","reset-link-error","set-new","set-new-field-errors","set-new-saving","set-new-error","set-new-saved"],"default":"forgot"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Colours, type, spacing and radius come from the Ki-Lo token stylesheet; data-theme picks dark or light.
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const s = this.props.screenState ?? 'forgot';
    const email = 'sam.taylor@example.com';
    const field = (id, label, type, ac, value, err, helper, hasForgot) => ({
      id, label, type, autocomplete: ac, value,
      border: err ? 'var(--danger)' : 'var(--border)', invalid: err ? 'true' : 'false',
      hasError: !!err, error: err ?? '', hasHelper: !err && !!helper, helper: helper ?? '',
      hasForgot: !!hasForgot
    });
    const isSignIn = s === 'sign-in-forgot';
    const isForgot = s.startsWith('forgot') && s !== 'forgot-sent';
    const isSetNew = s.startsWith('set-new') && s !== 'set-new-saved';
    const centredStates = {
      'forgot-sent': {
        isMail: true, isWarning: false, isCheck: false,
        iconBg: 'var(--surface-raised)', iconFg: 'var(--text-secondary)',
        title: 'Check your email',
        body: 'If ' + email + ' has a Ki-Lo account, a link to set a new password is on its way. Open it on this phone. It works once, for one hour.',
        hasPrimary: false, primary: '', hasSecondary: true, secondary: 'Back to sign in', hasResend: true
      },
      'reset-link-error': {
        isMail: false, isWarning: true, isCheck: false,
        iconBg: 'var(--danger-muted)', iconFg: 'var(--danger)',
        title: 'Reset link not valid',
        body: 'This link has expired or was already used. A link works once, for one hour, on the phone where you asked for it.',
        hasPrimary: true, primary: 'Send a new link', hasSecondary: true, secondary: 'Back to sign in', hasResend: false
      },
      'set-new-saved': {
        isMail: false, isWarning: false, isCheck: true,
        iconBg: 'var(--success-muted)', iconFg: 'var(--success)',
        title: 'Password saved',
        body: 'You are signed in. Use your new password next time. Other devices have been signed out.',
        hasPrimary: true, primary: 'Continue', hasSecondary: false, secondary: '', hasResend: false
      }
    };
    const centred = centredStates[s] ?? centredStates['forgot-sent'];
    const isCentred = !!centredStates[s];

    let fields = [];
    if (isSignIn) {
      fields = [
        field('email', 'Email', 'email', 'email', email, ''),
        field('password', 'Password', 'password', 'current-password', '', '', '', true)
      ];
    } else if (isForgot) {
      const v = s === 'forgot' ? email : s === 'forgot-field-error' ? 'sam.taylor@' : email;
      fields = [field('email', 'Email', 'email', 'email', v, s === 'forgot-field-error' ? 'Enter a valid email address' : '')];
    } else if (isSetNew) {
      const errs = s === 'set-new-field-errors';
      fields = [
        field('new', 'New password', 'password', 'new-password', s === 'set-new' ? '' : errs ? 'abc' : 'correcthorse', errs ? 'Password must be at least 8 characters' : '', 'At least 8 characters'),
        field('confirm', 'Confirm new password', 'password', 'new-password', s === 'set-new' ? '' : errs ? 'abcd' : 'correcthorse', errs ? 'The passwords do not match' : '')
      ];
    }
    const busy = s === 'forgot-sending' || s === 'set-new-saving';
    const errorSentence = s === 'forgot-error'
      ? 'Ki-Lo could not reach the server. Check your connection and try again.'
      : 'That is your current password. Choose a new one.';
    return {
      theme, noop: () => {},
      markUrl: theme === 'light' ? '/_blob/c63470fe9e703693009fc7010fee70d7' : '/_blob/4964715e6d361a8ee8e9932574b6ef64',
      hasBack: isForgot, isCentred, centred, centredRole: s === 'reset-link-error' ? 'alert' : 'status',
      isForm: !isCentred,
      formJustify: isSignIn ? 'center' : 'flex-start',
      formPadding: isSignIn ? '56px var(--space-6) 34px' : isForgot ? 'var(--space-4) var(--space-6) 34px' : '80px var(--space-6) 34px',
      hasMark: isSignIn,
      heading: isSignIn ? 'Welcome back' : isForgot ? 'Reset your password' : 'Set a new password',
      hasCaption: !isSignIn,
      caption: isForgot
        ? 'Enter the email you use for Ki-Lo. Ki-Lo will send a link to set a new password.'
        : 'For ' + email + '. Other devices will be signed out.',
      fields,
      hasError: s === 'forgot-error' || s === 'set-new-error',
      errorSentence,
      busy, busyLabel: s === 'forgot-sending' ? 'Sending link' : 'Saving password',
      labelVisibility: busy ? 'hidden' : 'visible',
      primary: isSignIn ? 'Sign in' : isForgot ? 'Send link' : 'Save password',
      hasGoogle: isSignIn,
      hasFooter: isSignIn || isForgot,
      footer: isSignIn ? 'New to Ki-Lo?' : 'Remembered it?',
      footerLink: isSignIn ? 'Create account' : 'Sign in'
    };
  }
}
</script>
</body>
</html>
