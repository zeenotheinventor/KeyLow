<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Targets, with Estimate my targets</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/6a739ab9f72fec4b3c50c348de3c56d0">
<link rel="stylesheet" href="/_blob/b7c5aa5a94130ec85cdd7a14e6ec57eb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font-sans); background: var(--background); color: var(--text-primary)">

<header data-kilo="SheetHeader sheet" style="flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2); padding: 56px var(--space-4) var(--space-3)">
<button class="kl-ib" type="button" aria-label="Back"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
<h1 class="t-h2" style="flex: 1; margin: 0; text-align: center">Targets</h1>
<span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0"></span>
</header>

<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-2) var(--space-4)">

<div data-kilo="GroupedList: ListRow (new row, the entry point)" class="kl-card" style="overflow: hidden; outline: {{outline}}; outline-offset: 2px">
<button type="button" aria-label="Estimate my targets, from a few questions about you and your goal" style="width: 100%; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); background: transparent; border: 0; text-align: left; font-family: var(--font-sans); color: var(--text-primary)">
<span style="width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-small); background: var(--surface-raised); color: var(--text-secondary)"><svg data-kilo="Icon Calculator (add to the icon map)" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"></rect><line x1="8" x2="16" y1="6" y2="6"></line><line x1="16" x2="16" y1="14" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-bs">Estimate my targets</span><span class="t-cap c-mut">From a few questions about you and your goal</span></span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--text-muted)"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</div>

<div class="kl-field">
<label class="t-ls" for="t-kcal">Calories</label>
<div data-kilo="NumericInput" class="kl-input">
<input id="t-kcal" inputmode="numeric" value="2200" onChange="{{noop}}" aria-describedby="t-kcal-help" class="t-body tab" style="flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; padding: 0; text-align: right; font-family: var(--font-sans); color: var(--text-primary)">
<span class="t-body c-mut">kcal</span>
</div>
<span id="t-kcal-help" class="t-cap c-mut">Between 800 and 6,000 kcal</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2)">
<sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
<div class="kl-field">
<label class="t-ls">{{m.label}}</label>
<div data-kilo="NumericInput" class="kl-input"><input inputmode="numeric" value="{{m.value}}" onChange="{{noop}}" aria-label="{{m.label}} target in grams" class="t-body tab" style="flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; padding: 0; text-align: right; font-family: var(--font-sans); color: var(--text-primary)"><span class="t-body c-mut">g</span></div>
</div>
</sc-for>
</div>
<span class="t-cap tab c-mut">Macros add up to 2,150 kcal</span>
</div>
<p class="t-cap c-mut" style="margin: 0">You set these yourself for now. Later, Ki-Lo will suggest targets from your weight trend.</p>
</div>

<div style="flex-shrink: 0; padding: var(--space-4) var(--space-4) 42px; background: var(--surface-sheet); border-top: 1px solid var(--border)">
<button data-kilo="Button primary lg" type="button" class="kl-btn kl-primary" style="width: 100%; height: var(--control-height-lg)">Save</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screenState":{"editor":"enum","options":["estimate-row","estimate-row-marked"],"default":"estimate-row"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const st = this.props.screenState ?? 'estimate-row';
    // The saved targets are the M3 board's sample (2,200 kcal, P 160, C 220, F 70); 160 x 4 + 220 x 4 + 70 x 9 = 2,150.
    return {
      theme,
      outline: st === 'estimate-row-marked' ? '2px dashed var(--accent)' : 'none',
      macros: [{ label: 'Protein', value: '160' }, { label: 'Carbohydrate', value: '220' }, { label: 'Fat', value: '70' }],
      noop: () => {}
    };
  }
}
</script>
</body>
</html>
