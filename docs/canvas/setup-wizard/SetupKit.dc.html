<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Setup components: OptionCard and the step header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/6a739ab9f72fec4b3c50c348de3c56d0">
<link rel="stylesheet" href="/_blob/b7c5aa5a94130ec85cdd7a14e6ec57eb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-3); overflow: hidden; padding: var(--space-4); font-family: var(--font-sans); background: var(--background); color: var(--text-primary)">

<span class="t-bs">OptionCard (new)</span>
<sc-for list="{{cards}}" as="o" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="t-cap c-mut">{{o.state}}</span>
<div data-kilo="OptionCard (new)" role="radio" aria-checked="{{o.checked}}" aria-disabled="{{o.disabled}}" style="min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-medium); background: {{o.bg}}; border: 1px solid {{o.border}}; box-shadow: {{o.shadow}}">
<span aria-hidden="true" style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-pill); border: 2px solid {{o.ring}}; background: {{o.dotBg}}; opacity: {{o.dim}}"><span style="width: 8px; height: 8px; border-radius: var(--radius-pill); background: {{o.dot}}"></span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: var(--space-2); opacity: {{o.dim}}"><span class="t-bs tab">{{o.title}}</span><sc-if value="{{o.hasBadge}}" hint-placeholder-val="{{ false }}"><span data-kilo="Badge" class="t-cap" style="height: 22px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 8px; border-radius: var(--radius-pill); background: var(--surface-raised); border: 1px solid var(--border); color: var(--text-secondary)">{{o.badge}}</span></sc-if></span>
<sc-if value="{{o.hasDesc}}" hint-placeholder-val="{{ true }}"><span class="t-cap c-sec" style="opacity: {{o.dim}}">{{o.desc}}</span></sc-if>
<sc-if value="{{o.hasReason}}" hint-placeholder-val="{{ false }}"><span class="t-cap c-sec" style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>{{o.reason}}</span></sc-if>
</span>
<sc-if value="{{o.hasValue}}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end"><span class="t-bs tab">{{o.value}}</span><span class="t-cap c-mut">{{o.valueCap}}</span></span></sc-if>
</div>
</div>
</sc-for>

<span class="t-bs" style="margin-top: var(--space-2)">Step header: SheetHeader with subtitle, then ProgressBar</span>
<sc-for list="{{headers}}" as="h" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="t-cap c-mut">{{h.state}}</span>
<div style="display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3) 0; border-radius: var(--radius-medium); border: 1px dashed var(--border-strong)">
<div style="display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3)">
<sc-if value="{{h.back}}" hint-placeholder-val="{{ true }}"><button class="kl-ib" type="button" aria-label="Back"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if>
<sc-if value="{{h.noBack}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0"></span></sc-if>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span class="t-h2">{{h.title}}</span><span class="t-cap tab c-sec">{{h.step}}</span></div>
<sc-if value="{{h.close}}" hint-placeholder-val="{{ false }}"><button class="kl-ib" type="button" aria-label="Close"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></sc-if>
<sc-if value="{{h.noClose}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0"></span></sc-if>
</div>
<div style="padding: 0 var(--space-3)"><div data-kilo="ProgressBar" role="progressbar" aria-label="{{h.step}}" style="height: 4px; overflow: hidden; border-radius: var(--radius-pill); background: var(--border)"><div style="height: 100%; width: {{h.width}}; border-radius: var(--radius-pill); background: var(--accent)"></div></div></div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const card = (state, o) => ({
      state,
      title: o.title,
      hasDesc: !!o.desc, desc: o.desc || '',
      hasReason: !!o.reason, reason: o.reason || '',
      hasBadge: !!o.badge, badge: o.badge || '',
      hasValue: !!o.value, value: o.value || '', valueCap: o.valueCap || '',
      checked: o.on ? 'true' : 'false',
      disabled: o.disabled ? 'true' : 'false',
      bg: o.on ? 'var(--accent-muted)' : 'var(--surface)',
      border: o.on ? 'var(--accent)' : 'var(--border)',
      shadow: o.on ? 'inset 0 0 0 1px var(--accent)' : 'none',
      ring: o.on ? 'var(--accent)' : 'var(--border-strong)',
      dotBg: o.on ? 'var(--accent)' : 'transparent',
      dot: o.on ? 'var(--accent-foreground)' : 'transparent',
      dim: o.disabled ? '0.4' : '1'
    });
    return {
      theme,
      cards: [
        card('Not chosen, title only', { title: 'Female' }),
        card('Not chosen, with a description', { title: 'Sedentary', desc: 'Mostly sitting, with little or no exercise.' }),
        card('Chosen', { title: 'Lightly active', desc: 'Some walking, or exercise 1 to 3 days a week.', on: true }),
        card('Chosen, with a badge and a value', { title: '0.5% a week', desc: 'A steady pace.', badge: 'Suggested', value: '0.4 kg', valueCap: 'a week', on: true }),
        card('Not chosen, with a value', { title: 'High', desc: '2.0 g per kg. Suits regular strength training.', value: '160 g', valueCap: 'a day' }),
        card('Disabled, with its reason', { title: 'Lose weight', reason: 'Not offered under 18.', disabled: true })
      ],
      headers: [
        { state: 'First run, step 1: no Back, no Close', title: 'About you', step: 'Step 1 of 8', width: '11.1%', back: false, noBack: true, close: false, noClose: true },
        { state: 'Recalculate, step 5: Back and Close', title: 'Goal', step: 'Step 5 of 8', width: '55.6%', back: true, noBack: false, close: true, noClose: false }
      ]
    };
  }
}
</script>
</body>
</html>
