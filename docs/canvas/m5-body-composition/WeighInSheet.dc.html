<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Weigh-in sheet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/ada61090711893f25bb9f30acdefcc93">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-screen="WeighInSheet" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: var(--font-sans); font-size: var(--type-body-size); line-height: var(--type-body-line); background: var(--background); color: var(--text-primary)">

<div aria-hidden="true" style="padding: 64px var(--space-4) 0; display: flex; flex-direction: column; gap: var(--space-3)">
<span style="font-size: var(--type-h2-size); line-height: var(--type-h2-line); font-weight: 600">Weight</span>
<div style="height: 112px; border-radius: var(--radius-large); background: var(--surface)"></div>
<div style="height: 220px; border-radius: var(--radius-large); background: var(--surface)"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-kilo="Sheet" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-2) var(--space-4) 42px; background: var(--surface-sheet); border-radius: var(--radius-large) var(--radius-large) 0 0">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--border-strong)"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="sheet-title" style="margin: 0; font-size: var(--type-h2-size); line-height: var(--type-h2-line); font-weight: var(--type-h2-weight)">{{title}}</h2>
<button data-kilo="Button ghost" type="button" style="height: 44px; padding: 0 var(--space-2); background: transparent; border: 0; font-family: var(--font-sans); font-size: var(--type-body-size); color: var(--text-secondary)">Cancel</button>
</div>

<sc-if value="{{imported}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-medium); background: var(--surface-raised); font-size: var(--type-label-small-size); line-height: var(--type-label-small-line); color: var(--text-secondary)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
Imported from {{healthName}}. Edit it in {{healthName}}.
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: var(--space-2)">
<label for="w-in" style="font-size: var(--type-label-small-size); line-height: var(--type-label-small-line); font-weight: 600">Weight</label>
<div data-kilo="NumericInput" style="height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); background: var(--surface-raised); border: {{inputBorder}}; border-radius: var(--radius-medium); opacity: {{inputOpacity}}">
<input id="w-in" inputmode="decimal" value="{{value}}" placeholder="0.0" readonly="{{readonly}}" aria-invalid="{{invalid}}" aria-describedby="w-help" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-family: var(--font-sans); font-size: 32px; line-height: 40px; font-weight: 600; color: var(--text-primary); font-feature-settings: var(--font-numeric)">
<span style="font-size: var(--type-body-size); color: var(--text-secondary)">kg</span>
</div>
<span id="w-help" style="font-size: var(--type-caption-size); line-height: var(--type-caption-line); color: {{helpColor}}">{{help}}</span>
</div>

<div data-kilo="Card" style="overflow: hidden; background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-medium)">
<button type="button" disabled="{{imported}}" style="width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-3); background: transparent; border: 0; border-bottom: 1px solid var(--border); font-family: var(--font-sans); font-size: var(--type-body-size); color: var(--text-primary)"><span>Date</span><span style="color: var(--text-secondary)">{{date}}</span></button>
<button type="button" disabled="{{imported}}" style="width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-3); background: transparent; border: 0; font-family: var(--font-sans); font-size: var(--type-body-size); color: var(--text-primary)"><span>Time</span><span style="color: var(--text-secondary); font-feature-settings: var(--font-numeric)">{{time}}</span></button>
</div>

<div style="display: flex; flex-direction: column; gap: var(--space-2)">
<label for="w-note" style="font-size: var(--type-label-small-size); line-height: var(--type-label-small-line); font-weight: 600">Note <span style="font-weight: 400; color: var(--text-muted)">(optional)</span></label>
<input id="w-note" value="{{note}}" placeholder="After a run, new scale, anything" style="height: var(--control-height-md); box-sizing: border-box; padding: 0 var(--space-3); background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-medium); font-family: var(--font-sans); font-size: var(--type-body-size); color: var(--text-primary)">
</div>

<sc-if value="{{saveError}}" hint-placeholder-val="{{ false }}">
<div role="alert" data-kilo="Banner danger" style="display: flex; gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-medium); background: var(--danger-muted); font-size: var(--type-label-small-size); line-height: var(--type-label-small-line); color: var(--text-primary)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px; color: var(--danger)"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
<span>Couldn't save your weigh-in. Check your connection and try again. What you typed is still here.</span>
</div>
</sc-if>

<sc-if value="{{deleteWarn}}" hint-placeholder-val="{{ false }}">
<div role="note" data-kilo="Banner warning" style="padding: var(--space-3); border-radius: var(--radius-medium); background: var(--warning-muted); font-size: var(--type-label-small-size); line-height: var(--type-label-small-line); color: var(--text-primary)">Deleting removes it from Ki-Lo only. It stays in {{healthName}} and won't come back on the next import.</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: var(--space-2)">
<sc-if value="{{showSave}}" hint-placeholder-val="{{ true }}">
<button data-kilo="Button primary" type="button" disabled="{{saveDisabled}}" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: var(--space-2); background: var(--accent); border: 0; border-radius: var(--radius-medium); font-family: var(--font-sans); font-size: var(--type-body-strong-size); font-weight: 600; color: var(--accent-foreground); opacity: {{saveOpacity}}">
<sc-if value="{{saving}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if>
{{saveLabel}}
</button>
</sc-if>
<sc-if value="{{showDelete}}" hint-placeholder-val="{{ false }}">
<button data-kilo="Button destructive" type="button" style="height: 52px; background: transparent; border: 1px solid var(--border-strong); border-radius: var(--radius-medium); font-family: var(--font-sans); font-size: var(--type-body-strong-size); font-weight: 600; color: var(--danger)">Delete weigh-in</button>
</sc-if>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["new","filled","invalid","saving","save-error","edit-manual","edit-imported"],"default":"new"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const state = this.props.state ?? 'new';
    const healthName = 'Health Connect';
    const imported = state === 'edit-imported';
    const editManual = state === 'edit-manual';
    const invalid = state === 'invalid';
    const saving = state === 'saving';
    const values = { new: '', filled: '81.4', invalid: '814', saving: '81.4', 'save-error': '81.4', 'edit-manual': '81.4', 'edit-imported': '81.6' };
    return {
      theme, healthName, imported, saving,
      invalid: invalid ? 'true' : 'false',
      title: imported || editManual ? 'Weigh-in' : 'Add weigh-in',
      value: values[state] ?? '',
      readonly: imported,
      inputBorder: invalid ? '2px solid var(--danger)' : '1px solid var(--border)',
      inputOpacity: imported ? 0.7 : 1,
      help: invalid ? 'Enter a weight between 20 and 400 kg.' : imported ? 'Imported readings can only be deleted here.' : 'Up to one decimal place.',
      helpColor: invalid ? 'var(--danger)' : 'var(--text-muted)',
      date: imported ? 'Today' : 'Today, Sat 17 Oct',
      time: imported ? '07:42' : '08:15',
      note: state === 'filled' || state === 'saving' || state === 'save-error' || editManual ? 'Before breakfast' : '',
      saveError: state === 'save-error',
      deleteWarn: imported,
      showSave: !imported,
      showDelete: imported || editManual,
      saveDisabled: state === 'new' || invalid || saving,
      saveOpacity: state === 'new' || invalid ? 0.45 : 1,
      saveLabel: saving ? 'Saving' : 'Save',
    };
  }
}
</script>
</body>
</html>
