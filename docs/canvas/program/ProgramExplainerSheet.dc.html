<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>How your programme works</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/6e06207071883255ccbdf89333df3876">
<link rel="stylesheet" href="/_blob/90e3afd83792749ff685abba2a03b9cc">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-screen="ProgramExplainerSheet" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: var(--font-sans); background: var(--background); color: var(--text-primary)">
<div aria-hidden="true" class="kl-dim" style="position: absolute; inset: 0"></div>

<section role="dialog" aria-modal="true" aria-labelledby="px-title" data-kilo="BottomSheet + SheetHeader (TrendExplainerSheet's structure)" style="position: absolute; left: 0; right: 0; bottom: 0; top: 60px; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-2) var(--space-5) 42px; overflow: hidden; background: var(--surface-sheet); border-radius: var(--radius-large) var(--radius-large) 0 0">
<span aria-hidden="true" style="flex-shrink: 0; align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--border-strong)"></span>
<div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between">
<h2 id="px-title" class="t-h2" style="margin: 0">How your programme works</h2>
<button data-kilo="Button ghost" type="button" style="height: 44px; padding: 0 var(--space-2); background: transparent; border: 0; font-family: var(--font-sans); font-size: var(--type-body-size); font-weight: 600; color: var(--accent-ink)">Done</button>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: {{justify}}">
<div style="flex-shrink: 0; display: flex; flex-direction: column; gap: var(--space-4)">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: var(--space-1)">
<h3 class="t-bs" style="margin: 0">{{s.title}}</h3>
<p class="tab" style="margin: 0; font-size: 14px; line-height: 21px; color: var(--text-secondary)">{{s.text}}</p>
</div>
</sc-for>
<p class="t-cap c-mut" style="margin: 0">Ki-Lo's estimates and targets are not medical advice. Speak to a doctor before you make big changes to your diet or your weight.</p>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["top","end"],"default":"top"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    // 'end' is the same sheet scrolled to its end, so the last sections and the note show.
    // Friday is the sample's check-in day (the weekday it set up on, Q1); the sheet fills in the person's own.
    return {
      theme,
      justify: this.props.state === 'end' ? 'flex-end' : 'flex-start',
      sections: [
        { title: 'Your expenditure', text: 'The energy you use in a day. Ki-Lo works it out from the food you log and how your weight trend moves: if your trend holds steady while you eat 2,000 kcal a day, you use about 2,000.' },
        { title: 'The weekly check-in', text: 'Every Friday, the day you started, Ki-Lo looks back over the last 4 weeks. It updates your expenditure, then sets the next week\'s targets from it. If you have been away, it catches up one week at a time.' },
        { title: 'The first two weeks', text: 'Your first check-in is two weeks after you start. Until then your expenditure is a starting estimate from your answers, and your targets stay as they are.' },
        { title: 'What a check-in needs', text: 'In the last 4 weeks: weigh-ins on at least 8 days, covering at least 14 days from the first to the last, and at least 10 complete days. Without them the estimate is carried forward and becomes less certain, and your targets are worked out again from it.' },
        { title: 'The likely range', text: 'Your expenditure comes with a range. The true figure is inside it 8 times in 10. The range narrows as you weigh in and complete your days.' },
        { title: 'Guardrails', text: 'Your expenditure moves by at most 250 kcal a week. Your target is never more than 30% below it or 20% above it, and never above 6,000 kcal. When you are losing weight it is never below 1,200 kcal or 90% of the energy you use at rest, whichever is higher. When a guardrail changes your target, the check-in says so.' },
        { title: 'Water, glycogen and muscle', text: 'Ki-Lo counts 7,700 kcal for each kilogram your trend moves, which assumes the change is mostly fat. In the first weeks of a new deficit you also lose water and glycogen, so your weight falls faster and your expenditure can look higher than it is. If you gain mostly muscle, a kilogram holds less energy, so your expenditure can look lower than it is.' }
      ]
    };
  }
}
</script>
</body>
</html>
