<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Edit programme</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/6e06207071883255ccbdf89333df3876">
<link rel="stylesheet" href="/_blob/90e3afd83792749ff685abba2a03b9cc">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-screen="ProgramEditScreen" style="position: relative; width: 390px; height: {{rootH}}; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font-sans); background: var(--background); color: var(--text-primary)">

<header data-kilo="SheetHeader sheet (Close on the right, as the setup recalculate)" style="flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2); padding: 56px var(--space-4) var(--space-3); border-bottom: 1px solid var(--border)">
<span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0"></span>
<h1 class="t-h2" style="flex: 1; margin: 0; text-align: center">Edit programme</h1>
<button class="kl-ib" type="button" aria-label="Close" aria-disabled="{{busy}}" style="opacity: {{closeOpacity}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: {{justify}}">
<div style="flex-shrink: 0; display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-5) var(--space-4) var(--space-5)">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="display: flex; flex-direction: column; gap: var(--space-3)">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 class="t-h2" style="margin: 0">{{g.title}}</h2>
<sc-if value="{{g.hasHelper}}" hint-placeholder-val="{{ true }}"><p class="t-cap c-sec" style="margin: 0">{{g.helper}}</p></sc-if>
</div>
<div role="radiogroup" aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: var(--space-2)">
<sc-for list="{{g.options}}" as="o" hint-placeholder-count="3">
<div data-kilo="OptionCard (the setup kit's)" role="radio" aria-checked="{{o.checked}}" aria-disabled="{{o.disabled}}" aria-label="{{o.aria}}" style="min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-medium); background: {{o.bg}}; border: 1px solid {{o.border}}; box-shadow: {{o.shadow}}">
<span aria-hidden="true" style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-pill); border: 2px solid {{o.ring}}; background: {{o.dotBg}}; opacity: {{o.dim}}"><span style="width: 8px; height: 8px; border-radius: var(--radius-pill); background: {{o.dot}}"></span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: var(--space-2); opacity: {{o.dim}}"><span class="t-bs tab">{{o.title}}</span><sc-if value="{{o.hasBadge}}" hint-placeholder-val="{{ false }}"><span data-kilo="Badge" class="t-cap" style="height: 22px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 8px; border-radius: var(--radius-pill); background: var(--surface-raised); border: 1px solid var(--border); color: var(--text-secondary)">{{o.badge}}</span></sc-if></span>
<sc-if value="{{o.hasDesc}}" hint-placeholder-val="{{ true }}"><span class="t-cap c-sec" style="opacity: {{o.dim}}">{{o.desc}}</span></sc-if>
<sc-if value="{{o.hasReason}}" hint-placeholder-val="{{ false }}"><span class="t-cap c-sec" style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>{{o.reason}}</span></sc-if>
</span>
<sc-if value="{{o.hasValue}}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end"><span class="t-bs tab">{{o.value}}</span><span class="t-cap c-mut">{{o.valueCap}}</span></span></sc-if>
</div>
</sc-for>
</div>
<sc-if value="{{g.hasNote}}" hint-placeholder-val="{{ false }}">
<div data-kilo="Banner info" role="note" style="display: flex; gap: var(--space-3); padding: var(--space-3); background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-medium)">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--text-secondary)"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-bs">{{g.noteTitle}}</span><span class="t-body c-sec">{{g.noteBody}}</span></div>
</div>
</sc-if>
</section>
</sc-for>
</div>
</main>

<footer style="flex-shrink: 0; display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4) var(--space-4) 42px; background: var(--surface-sheet); border-top: 1px solid var(--border)">
<sc-if value="{{saveError}}" hint-placeholder-val="{{ false }}">
<div data-kilo="Banner error, sentence only" role="alert" style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--danger-muted); border: 1px solid var(--danger); border-radius: var(--radius-medium)">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--danger)"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
<span class="t-body" style="flex: 1">Not saved. Check your connection and try again.</span>
</div>
</sc-if>
<p class="t-cap tab c-sec" style="margin: 0">{{footNote}}</p>
<button data-kilo="Button primary lg" type="button" class="kl-btn kl-primary" aria-busy="{{busy}}" aria-disabled="{{busy}}" style="position: relative; width: 100%; height: var(--control-height-lg)">
<sc-if value="{{saving}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></span></sc-if>
<span style="visibility: {{ctaVis}}">Save changes</span>
</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screenState":{"editor":"enum","options":["default","under-18","saving","save-error"],"default":"default"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const st = this.props.screenState ?? 'default';
    const opt = (title, desc, x) => Object.assign({ title, desc: desc || '', on: false, disabled: false, reason: '', badge: '', value: '', valueCap: '', aria: '' }, x || {});
    const card = (o) => ({
      title: o.title,
      aria: o.aria || [o.title, o.badge ? o.badge.toLowerCase() : '', o.disabled ? o.reason.replace(/\.$/, '').toLowerCase() : o.desc.replace(/\.$/, '').toLowerCase(), o.value ? 'about ' + o.value.replace(' kg', ' kilograms ').replace(' g', ' grams ') + o.valueCap : ''].filter(Boolean).join(', '),
      hasDesc: !!o.desc && !o.disabled, desc: o.desc,
      hasReason: !!o.reason, reason: o.reason,
      hasBadge: !!o.badge, badge: o.badge,
      hasValue: !!o.value, value: o.value, valueCap: o.valueCap,
      checked: o.on ? 'true' : 'false',
      disabled: o.disabled ? 'true' : 'false',
      bg: o.on ? 'var(--accent-muted)' : 'var(--surface)',
      border: o.on ? 'var(--accent)' : 'var(--border)',
      shadow: o.on ? 'inset 0 0 0 1px var(--accent)' : 'none',
      ring: o.on ? 'var(--accent)' : 'var(--border-strong)',
      dotBg: o.on ? 'var(--accent)' : 'transparent',
      dot: o.on ? 'var(--accent-foreground)' : 'transparent',
      dim: o.disabled ? '0.4' : '1'
    });
    // Prefilled from the programme of the golden fixture after its third check-in: lose 0.5 %, moderate, balanced,
    // trend weight 79.02 kg (the weight the targets use). Rate values pct / 100 x 79.02 to one decimal: 0.2, 0.4, 0.6, 0.8 kg.
    // Protein g/kg x 79.02, whole grams: 126, 158, 174 g. The under-18 board is the same person drawn at 16.
    const under18 = st === 'under-18';
    const goal = {
      title: 'Goal', helper: '',
      options: [
        under18 ? opt('Lose weight', '', { disabled: true, reason: 'Not offered under 18.' }) : opt('Lose weight', 'Eat a little less than you use.', { on: true }),
        opt('Maintain weight', 'Eat about what you use.', { on: under18 }),
        opt('Gain weight', 'Eat a little more than you use.')
      ],
      note: under18
        ? ['Talk to a health professional', 'If you are under 18 and want to lose weight, or you are pregnant or breastfeeding, talk to a doctor, midwife or dietitian first.']
        : ['Pregnant or breastfeeding?', 'Talk to a doctor, midwife or dietitian before you set a goal. Ki-Lo\'s estimates do not allow for pregnancy or breastfeeding.']
    };
    const rate = {
      title: 'Rate', helper: 'As a share of your body weight each week. Slower is easier to keep up.',
      options: [
        opt('0.25% a week', 'Gentle, and easy to keep up.', { value: '0.2 kg', valueCap: 'a week' }),
        opt('0.5% a week', 'A steady pace.', { on: true, badge: 'Suggested', value: '0.4 kg', valueCap: 'a week' }),
        opt('0.75% a week', 'Faster, and harder to keep up.', { value: '0.6 kg', valueCap: 'a week' }),
        opt('1.0% a week', 'The fastest Ki-Lo sets.', { value: '0.8 kg', valueCap: 'a week' })
      ]
    };
    const protein = {
      title: 'Protein', helper: 'Set first, from your weight. Fat and carbohydrate share the rest.',
      options: [
        opt('Moderate', '1.6 g per kg of body weight. Enough for most people.', { on: true, value: '126 g', valueCap: 'a day' }),
        opt('High', '2.0 g per kg. Suits regular strength training.', { value: '158 g', valueCap: 'a day' }),
        opt('Very high', '2.2 g per kg. Helps keep muscle while you lose weight.', { value: '174 g', valueCap: 'a day' })
      ]
    };
    const diet = {
      title: 'Diet style', helper: 'How the calories left after protein are split between fat and carbohydrate.',
      options: [
        opt('Balanced', 'A mix of both, as most people eat.', { on: true }),
        opt('Low fat', 'More bread, rice, pasta and fruit. Less oil and butter.'),
        opt('Low carb', 'More meat, fish, eggs, dairy and oils. Less bread and rice. Not keto.')
      ]
    };
    const groups = (under18 ? [goal, protein, diet] : [goal, rate, protein, diet]).map((g) => ({
      title: g.title, hasHelper: !!g.helper, helper: g.helper,
      options: g.options.map(card),
      hasNote: !!g.note, noteTitle: g.note ? g.note[0] : '', noteBody: g.note ? g.note[1] : ''
    }));
    const saving = st === 'saving';
    const scrolledToEnd = st === 'saving' || st === 'save-error';
    return {
      theme,
      rootH: scrolledToEnd ? '844px' : (under18 ? '1480px' : '1840px'),
      justify: scrolledToEnd ? 'flex-end' : 'flex-start',
      groups,
      footNote: 'Saving changes your targets from today. Your expenditure estimate stays at 2,580 kcal a day.',
      saving,
      busy: saving ? 'true' : 'false',
      closeOpacity: saving ? '0.4' : '1',
      ctaVis: saving ? 'hidden' : 'visible',
      saveError: st === 'save-error'
    };
  }
}
</script>
</body>
</html>
