<script type="text/x-dc" data-dc-script data-props='{"screenState":{"editor":"enum","options":["delete-account-row","today"],"default":"delete-account-row"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Colours, type, spacing and radius come from the Ki-Lo token stylesheet. data-theme picks dark or light.
    // More as it ships (apps/mobile/app/(tabs)/more/index.tsx), scrolled to the end so the Account group shows.
    // Food, Nutrition, Body and the top of Settings are above the fold. The Settings rows in view are the shipped ones.
    // delete-account-row adds the new row, last in Account, after Sign out (KEY-1117). today is Account as it ships now.
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const st = this.props.screenState ?? 'delete-account-row';
    return { theme, hasDeleteRow: st !== 'today' };
  }
}
</script>
