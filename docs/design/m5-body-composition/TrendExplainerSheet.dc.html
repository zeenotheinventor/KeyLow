<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>How the trend works</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/ada61090711893f25bb9f30acdefcc93">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" data-screen="TrendExplainerSheet" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: var(--font-sans); font-size: var(--type-body-size); line-height: var(--type-body-line); background: var(--background); color: var(--text-primary)">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="ex-title" data-kilo="Sheet" style="position: absolute; left: 0; right: 0; bottom: 0; top: 60px; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-2) var(--space-5) 42px; overflow: hidden; background: var(--surface-sheet); border-radius: var(--radius-large) var(--radius-large) 0 0">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--border-strong)"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="ex-title" style="margin: 0; font-size: var(--type-h2-size); line-height: var(--type-h2-line); font-weight: var(--type-h2-weight)">How your trend works</h2>
<button data-kilo="Button ghost" type="button" style="height: 44px; padding: 0 var(--space-2); background: transparent; border: 0; font-family: var(--font-sans); font-size: var(--type-body-size); font-weight: 600; color: var(--accent-ink)">Done</button>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: var(--space-4)">
<sc-if value="{{settling}}" hint-placeholder-val="{{ false }}">
<div data-kilo="Banner warning" style="flex-shrink: 0; margin-top: {{scrollShift}}; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-medium); background: var(--warning-muted)">
<span style="font-size: var(--type-label-small-size); line-height: var(--type-label-small-line); font-weight: 600">Your trend is settling: 3 of 7 weigh-ins</span>
<div role="progressbar" aria-valuemin="0" aria-valuemax="7" aria-valuenow="3" aria-label="Weigh-ins towards a settled trend" style="height: 6px; border-radius: 3px; background: var(--surface-raised); overflow: hidden"><div style="width: 43%; height: 6px; background: var(--warning)"></div></div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: var(--space-4)">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: var(--space-1)">
<h3 style="margin: 0; font-size: var(--type-body-strong-size); line-height: var(--type-body-strong-line); font-weight: 600">{{s.title}}</h3>
<p style="margin: 0; font-size: var(--type-label-small-size); line-height: 21px; color: var(--text-secondary)">{{s.text}}</p>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: var(--type-caption-size); line-height: var(--type-caption-line); color: var(--text-muted)">The trend is an estimate. It isn't medical advice.</p>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","settling","settling-end"],"default":"default"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    return {
      theme,
      // 'settling-end' is the settling sheet drawn scrolled to the end, so the last section and the footer show.
      settling: this.props.state === 'settling' || this.props.state === 'settling-end',
      scrollShift: this.props.state === 'settling-end' ? '-90px' : '0px',
      sections: [
        { title: 'Why a trend', text: 'Your weight moves by a kilo or more from day to day with water, salt and food. The trend smooths that out so you can see where you are really heading.' },
        { title: 'Settling', text: 'The trend needs 7 weigh-ins before it is steady. Until then it is drawn dashed and can move a lot.' },
        { title: 'Readings left out', text: 'A reading far from the rest, like 95 kg after a week around 80 kg, is left out of the trend. If your next reading is close to it, it counts after all.' },
        { title: 'Missing days', text: 'Days without a weigh-in are filled in from the days around them. After a gap of more than 30 days the trend starts again.' },
        { title: 'Weekly rate', text: 'How much the trend has moved over the last 7 days, shown as a gain or loss a week.' },
        { title: 'Body fat and lean mass', text: 'Smoothed like your weight. Scales estimate them and readings change with the water you hold, so the trend matters more than any one reading. Lean mass includes bone and water as well as muscle.' },
      ],
    };
  }
}
</script>
</body>
</html>
