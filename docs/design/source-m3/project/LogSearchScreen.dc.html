<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Search in log mode</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c95588d44fb532c449b40cf4b94c3f5c">
<link rel="stylesheet" href="/_blob/2327a85940832eff6a39c0c61e55fbca">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font-sans); background: var(--background); color: var(--text-primary)">

<header data-kilo="SheetHeader + SlotPill" style="flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2); padding: 56px var(--space-4) var(--space-3)">
<button class="kl-ib" type="button" aria-label="Close"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
<h1 class="t-h2" style="flex: 1; margin: 0; text-align: center">Log food</h1>
<button data-kilo="SlotPill" type="button" aria-label="Meal: Lunch, change" aria-expanded="{{pickerOpen}}" class="t-ls" style="height: 44px; display: inline-flex; align-items: center; gap: 4px; padding: 0 var(--space-2) 0 var(--space-3); border: 1px solid {{pillBorder}}; border-radius: var(--radius-pill); background: var(--surface-raised); color: var(--text-primary); font-family: var(--font-sans)">Lunch<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
</header>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: var(--space-4); padding: 0 var(--space-4) var(--space-4)">

<sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
<div class="kl-card" style="overflow: hidden">
<button data-kilo="ListRow: Quick add" type="button" style="width: 100%; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); background: transparent; border: 0; text-align: left; font-family: var(--font-sans); color: var(--text-primary)">
<span style="width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-small); background: var(--surface-raised); color: var(--text-secondary)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-bs">Quick add</span><span class="t-cap c-mut">Calories and macros by hand</span></span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted)"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</div>
</sc-if>

<sc-if value="{{recent}}" hint-placeholder-val="{{ true }}">
<section aria-label="Recent" style="display: flex; flex-direction: column; gap: var(--space-2)">
<h2 class="t-bs" style="margin: 0; padding: 0 var(--space-1)">Recent<span class="t-cap c-mut"> · as last logged</span></h2>
<div data-kilo="GroupedList" role="list" class="kl-card" style="overflow: hidden">
<sc-for list="{{recentRows}}" as="r" hint-placeholder-count="8">
<button data-kilo="FoodRow (logged amount)" type="button" role="listitem" style="width: 100%; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3) var(--space-2) var(--space-4); background: transparent; border: 0; border-top: {{r.divider}}; text-align: left; font-family: var(--font-sans); color: var(--text-primary)">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-bs" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span class="t-cap tab c-mut">{{r.sub}}</span></span>
<span class="t-bs tab">{{r.kcal}}</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--text-muted)"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</sc-for>
</div>
</section>
</sc-if>

<sc-if value="{{noHistory}}" hint-placeholder-val="{{ false }}">
<div data-kilo="EmptyState" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); padding: 0 var(--space-6); text-align: center">
<span style="width: 56px; height: 56px; margin-bottom: var(--space-2); display: flex; align-items: center; justify-content: center; border-radius: var(--radius-medium); background: var(--surface-raised); color: var(--text-muted)"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg></span>
<h2 class="t-h2" style="margin: 0">Nothing recent</h2>
<p class="t-body c-sec" style="margin: 0">Foods you log appear here.</p>
</div>
</sc-if>

<sc-if value="{{results}}" hint-placeholder-val="{{ false }}">
<section aria-label="UK CoFID" style="display: flex; flex-direction: column; gap: var(--space-2)">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-1)">
<h2 class="t-bs" style="margin: 0">Generic foods<span class="t-cap c-mut"> · UK CoFID · per 100 g</span></h2>
<button type="button" class="t-ls c-sec" style="min-height: 44px; margin: -6px -4px; padding: 0 var(--space-1); background: transparent; border: 0; font-family: var(--font-sans)">See 9 more</button>
</div>
<div data-kilo="GroupedList" role="list" class="kl-card" style="overflow: hidden">
<sc-for list="{{resultRows}}" as="r" hint-placeholder-count="6">
<button data-kilo="FoodRow (search, per 100 g)" type="button" role="listitem" style="width: 100%; min-height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3) var(--space-2) var(--space-4); background: transparent; border: 0; border-top: {{r.divider}}; text-align: left; font-family: var(--font-sans); color: var(--text-primary)">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-body" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><strong style="font-weight: 600">{{r.match}}</strong>{{r.rest}}</span><span class="t-cap tab c-mut">{{r.sub}}</span></span>
<span class="t-bs tab">{{r.kcal}}</span>
<sc-if value="{{plate}}" hint-placeholder-val="{{ false }}"><span aria-label="Add {{r.title}} to plate" role="img" style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent); color: var(--accent-foreground)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></sc-if>
<sc-if value="{{noPlate}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--text-muted)"><path d="m9 18 6-6-6-6"></path></svg></sc-if>
</button>
</sc-for>
</div>
</section>
</sc-if>
</div>

<sc-if value="{{plate}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: 104px; z-index: 20; display: flex; justify-content: center">
<button type="button" class="t-ls kl-toast" style="padding: 0 var(--space-4); font-family: var(--font-sans)">Plate: 3 foods, 631 kcal<span class="c-ink">Log all</span></button>
</div>
</sc-if>

<div style="flex-shrink: 0; padding: var(--space-2) var(--space-4) 42px; border-top: 1px solid var(--border); background: var(--surface)">
<div data-kilo="SearchField" role="search" style="height: var(--control-height-md); box-sizing: border-box; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-1) 0 var(--space-4); background: var(--surface-raised); border: 1px solid {{fieldBorder}}; border-radius: var(--radius-medium); color: var(--text-muted)">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<span class="t-body" style="flex: 1; color: {{queryColor}}">{{queryText}}</span>
<button type="button" aria-label="Scan barcode" style="width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; color: var(--text-primary)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 7v10"></path><path d="M12 7v10"></path><path d="M17 7v10"></path></svg></button>
</div>
</div>

<sc-if value="{{pickerOpenFlag}}" hint-placeholder-val="{{ false }}">
<div class="kl-dim" aria-hidden="true" style="position: absolute; inset: 0; z-index: 30; opacity: 0.6"></div>
<div data-kilo="SlotPill picker" role="radiogroup" aria-label="Meal" class="kl-card" style="position: absolute; top: 108px; right: var(--space-4); z-index: 31; width: 200px; overflow: hidden; background: var(--surface-sheet); box-shadow: var(--elevation-sheet)">
<sc-for list="{{slots}}" as="o" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{o.on}}" style="width: 100%; min-height: 48px; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3); border: 0; border-top: {{o.divider}}; background: {{o.bg}}; color: var(--text-primary); text-align: left; font-family: var(--font-sans)">
<span class="t-body" style="flex: 1; font-weight: {{o.weight}}">{{o.label}}</span>
<sc-if value="{{o.check}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-ink)"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{proposal}}" hint-placeholder-val="{{ false }}">
<span class="t-cap c-warn" style="position: absolute; top: 14px; right: 12px; z-index: 50; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--warning-muted); border: 1px solid var(--warning)">Proposal, not built</span>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screenState":{"editor":"enum","options":["idle-recent","idle-no-history","slot-picker","results","plate-proposal"],"default":"idle-recent"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const st = this.props.screenState ?? 'idle-recent';
    const g = (n) => { const a = Math.abs(n); return String(a < 10 ? Math.round(a * 10) / 10 : Math.round(a)); };
    const kc = (n) => Math.round(n).toLocaleString('en-GB');
    const macro = (p, f, c) => 'P ' + g(p) + ' g · F ' + g(f) + ' g · C ' + g(c) + ' g';
    const recent = [
      ['Salmon fillet, baked', '120 g', 247, 25, 16, 0],
      ['Greek yoghurt 0% fat', '1 pot (170 g)', 97, 17.3, 0.3, 6.5],
      ['Meal deal crisps', null, 130, 2, 7, 15],
      ['Basmati rice, boiled', '180 g', 216, 4.9, 0.7, 47.5],
      ['Chicken breast, grilled', '150 g', 222, 48, 3.3, 0],
      ['Banana', '1 medium (100 g)', 95, 1.2, 0.1, 20.3],
      ['Semi-skimmed milk', '200 ml', 92, 7, 3.4, 9.6],
      ['Porridge oats', '50 g', 187, 5.6, 4.2, 30.2]
    ].map((r, i) => ({ title: r[0], sub: (r[1] ? r[1] : 'Quick add') + ' · ' + macro(r[3], r[4], r[5]), kcal: kc(r[2]), divider: i ? '1px solid var(--border)' : '0' }));
    const results = [
      ['Chicken', ' breast, grilled', 148, 32, 2.2, 0],
      ['Chicken', ' breast, raw', 106, 24, 1.1, 0],
      ['Chicken', ' thigh, roasted', 229, 25, 14, 0],
      ['Chicken', ' tikka', 150, 22, 6, 2.5],
      ['Chicken', ' soup, canned', 48, 2.4, 2.1, 5]
    ].map((r, i) => ({ match: r[0], rest: r[1], title: r[0] + r[1], sub: macro(r[3], r[4], r[5]), kcal: kc(r[2]), divider: i ? '1px solid var(--border)' : '0' }));
    const isResults = st === 'results' || st === 'plate-proposal';
    const picker = st === 'slot-picker';
    const slots = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'].map((label, i) => ({ label, on: label === 'Lunch' ? 'true' : 'false', check: label === 'Lunch', bg: label === 'Lunch' ? 'var(--surface-raised)' : 'transparent', weight: label === 'Lunch' ? 600 : 400, divider: i ? '1px solid var(--border)' : '0' }));
    return {
      theme,
      idle: !isResults,
      recent: st === 'idle-recent' || picker,
      recentRows: recent,
      noHistory: st === 'idle-no-history',
      results: isResults,
      resultRows: results,
      plate: st === 'plate-proposal',
      noPlate: st !== 'plate-proposal',
      proposal: st === 'plate-proposal',
      pickerOpen: picker ? 'true' : 'false',
      pickerOpenFlag: picker,
      pillBorder: picker ? 'var(--accent)' : 'var(--border)',
      slots,
      fieldBorder: st === 'idle-no-history' || isResults ? 'var(--accent)' : 'var(--border)',
      queryText: isResults ? 'chicken' : 'Search for a food',
      queryColor: isResults ? 'var(--text-primary)' : 'var(--text-muted)'
    };
  }
}
</script>
</body>
</html>
