pre-commit:
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,json,md,mdx,yml,yaml,css}"
      run: pnpm exec prettier --write {staged_files} && git add {staged_files}
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm exec eslint --flag v10_config_lookup_from_file --no-warn-ignored {staged_files}
